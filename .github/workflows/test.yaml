name: test

on:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
 
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch

      - name: Build package
        run: hatch build

      - name: Run tests
        run: hatch run test.py${{ matrix.python-version }}:test
